spring.application.name=fincredex


# ===============================
# SERVER
# ===============================

server.port=${PORT:8189}


# ===============================
# FRONTEND
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fincredex}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.lifetime=3600000
jwt.expiration=103600000


# ===============================
# ANTHROPIC AI
# ===============================

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-5


# ===============================
# LOGGING
# ===============================

logging.level.com.fincredex=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.flywaydb=DEBUG


# ===============================
# SWAGGER
# ===============================

swagger.servers.first=${BACKEND_URL:http://localhost:8189}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ===============================
# FLYWAY
# ===============================

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true


# ===============================
# GOOGLE OAUTH
# ===============================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:8189}/login/oauth2/code/google

spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub